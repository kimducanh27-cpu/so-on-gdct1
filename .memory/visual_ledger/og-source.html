<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>OG source</title>
<style>
  @font-face {
    font-family: "Newsreader";
    font-style: normal;
    font-weight: 300 500;
    src: url("../../app/assets/fonts/newsreader-400-normal-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Newsreader";
    font-style: normal;
    font-weight: 300 500;
    src: url("../../app/assets/fonts/newsreader-400-normal-vietnamese.woff2") format("woff2");
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  @font-face {
    font-family: "Newsreader";
    font-style: italic;
    font-weight: 300 500;
    src: url("../../app/assets/fonts/newsreader-400-italic-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Newsreader";
    font-style: italic;
    font-weight: 300 500;
    src: url("../../app/assets/fonts/newsreader-400-italic-vietnamese.woff2") format("woff2");
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  @font-face {
    font-family: "Space Grotesk";
    font-style: normal;
    font-weight: 400 700;
    src: url("../../app/assets/fonts/space-400-normal-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Space Grotesk";
    font-style: normal;
    font-weight: 400 700;
    src: url("../../app/assets/fonts/space-400-normal-vietnamese.woff2") format("woff2");
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  :root {
    --paper: #F4F1EA;
    --ink: #141A18;
    --rust: #C0392B;
    --green: #1F5C4A;
    --rule: #D8D2C2;
    --muted: #555C55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Space Grotesk", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 30px 64px 22px;
    display: flex;
    flex-direction: column;
  }
  .og::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid var(--rule);
    pointer-events: none;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--ink);
    position: relative;
    z-index: 1;
  }
  .brand {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 13px;
  }
  .mark {
    width: 14px;
    height: 14px;
    background: var(--rust);
    display: inline-block;
  }
  .exam {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .exam b { color: var(--ink); font-weight: 700; }
  .body {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-top: 14px;
    position: relative;
    z-index: 1;
  }
  .copy { width: 660px; }
  .eyebrow {
    margin: 0 0 14px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--green);
  }
  .eyebrow span { color: var(--rust); }
  h1 {
    margin: 0;
    font-family: "Newsreader", Georgia, serif;
    font-weight: 400;
    font-size: 84px;
    line-height: 0.95;
    letter-spacing: -0.02em;
  }
  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--rust);
    font-size: 77px;
    letter-spacing: -0.015em;
  }
  .sub {
    margin: 18px 0 0;
    font-size: 22px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 520px;
    letter-spacing: 0.005em;
  }
  .shot {
    width: 214px;
    margin-right: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .frame {
    width: 206px;
    padding: 6px;
    background: #FBFAF6;
    border: 1px solid #C6BDA9;
    box-shadow: 0 24px 46px -16px rgba(20, 26, 24, 0.35);
  }
  .frame img {
    display: block;
    width: 194px;
    height: 421px;
    object-fit: cover;
    object-position: top center;
  }
  .caption {
    margin: 10px 0 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .caption .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rust);
  }
  .rail {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    position: relative;
    z-index: 1;
  }
  .ticks {
    display: flex;
    gap: 7px;
    align-items: flex-end;
    height: 26px;
  }
  .tick {
    flex: 1;
    height: 21px;
    background: var(--green);
    position: relative;
  }
  .tick.review {
    background: transparent;
    border: 2px solid var(--rust);
    height: 26px;
  }
  .tick.today::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -9px;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--rust);
  }
  .rail-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 6px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rail-label .today-label { color: var(--rust); }
  .rail-label .exam-label b { color: var(--ink); }
</style>
</head>
<body>
  <div class="og">
    <header>
      <div class="brand"><span class="mark"></span>Sổ Ôn GDCT1</div>
      <div class="exam">Kỳ thi <b>12.11.2026</b></div>
    </header>
    <div class="body">
      <div class="copy">
        <p class="eyebrow"><span>20 ngày</span> · từ 24.10</p>
        <h1>20 ngày,<br>100 câu hỏi,<br><em>một cuốn sổ.</em></h1>
        <p class="sub">Một phiên vừa sức mỗi ngày: câu mới, câu đến hạn và chỗ chốt đáp án. Không tài khoản, không backend.</p>
      </div>
      <div class="shot">
        <div class="frame"><img src="../../assets/landing/today-390.webp" width="390" height="844" alt=""></div>
        <p class="caption"><span class="dot"></span>Ngày 01 / 20</p>
      </div>
    </div>
    <div class="rail" aria-hidden="true">
      <div class="ticks">
        <span class="tick today"></span>
        <span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span>
        <span class="tick review"></span><span class="tick review"></span><span class="tick review"></span><span class="tick review"></span><span class="tick review"></span><span class="tick review"></span><span class="tick review"></span><span class="tick review"></span>
      </div>
      <div class="rail-label">
        <span class="today-label">01 · hôm nay</span>
        <span>12 ngày học mới · 8 ngày ôn</span>
        <span class="exam-label"><b>20</b> · 12.11.2026</span>
      </div>
    </div>
  </div>
</body>
</html>
